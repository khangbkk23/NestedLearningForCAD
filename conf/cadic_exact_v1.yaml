# CADIC-compatible foundation protocol.
# The checkpoint identity and several preprocessing details are unresolved in
# the paper; the runner fails loudly until they are explicitly supplied.
protocol:
  name: "cadic_compatible_v1"
  source_pdf_sha256: "fce2e29ab8bc41f2ec97293f6922521982d7fc493028d2052996f2fd77f92116"
  exact_claim_allowed: false
  unresolved:
    - "ViT-B/8 checkpoint file identity"
    - "layer 9 zero-based/one-based implementation convention"
    - "resize/crop/interpolation and normalization details"
    - "feature L2 normalization"
    - "numeric b in equation (9)"
    - "batch size and initialization details"

dataset:
  name: "mvtec"
  root_dir: "data/mvtec"
  img_size: 224
  batch_size: 32
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  drop_last_train: false
  cadic_parity: true
  synthetic_anomaly: false
  load_test_during_stream: false
  split_ratio: 0.8
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  class_order:
    [bottle, cable, capsule, carpet, grid, hazelnut, leather, metal_nut,
     pill, screw, tile, toothbrush, transistor, wood, zipper]

extractor:
  model_name: "vit_base_patch8_224"
  checkpoint_path: ""
  checkpoint_identity: ""
  pretraining: "ImageNet-21k"
  image_size: 224
  patch_size: 8
  embed_dim: 768
  layer_number: 9
  layer_indexing: "one_based"
  feature_normalization: "unspecified_by_paper"

memory:
  budget: 10000
  budgets_ladder: [2500, 5000, 10000]
  distance: "euclidean"
  dtype: "float32"
  chunk_size: 2048
  image_neighbors_b: 9
  initialization: "deterministic_input_order_until_full"

training:
  seed: 42
  device: "cuda"
  dev_fraction: 0.1
  dev_manifest: "results/cadic_dev_manifest_v1.json"

evaluation:
  final_only: true
  use_all_pixels: true
  pixel_sample_limit: null
  score_normalization: "none"
  gaussian_smoothing_sigma: 0.0
  macro_tasks: true

logging:
  results_dir: "results"
  save_state: true
