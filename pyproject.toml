[build-system]
requires = ["setuptools>=68,<82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hope-cad"
version = "0.7.0"
description = "Nested Learning for Continual Anomaly Detection"
readme = "README.md"
requires-python = ">=3.13"
license = {file = "LICENSE"}
dependencies = [
  "torch>=2.0", "torchvision>=0.15", "numpy>=1.24",
  "scikit-learn>=1.4", "PyYAML>=6.0", "Pillow>=9.5",
  "timm>=1.0.20,<2", "safetensors>=0.4.5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
hope-cad = "hope_cad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hope_cad = ["resources/*.json", "resources/protocols/*.yaml", "resources/methods/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
