[workspace]
channels = ["conda-forge"]
name = "NestedLearningForCAD"
platforms = ["win-64", "linux-64"]
version = "0.1.0"

[tasks]
install = "python -c \"import hope_cad; print(hope_cad.__file__)\""
test = "python -B -m hope_cad.local_tests"
preflight-local = "python -B -m hope_cad preflight --local-smoke --device cpu --run-dir results/local-preflight"
cad = "python -B -m hope_cad"
assets = "python -B -m hope_cad.data.provision"
download-mvtec = "python -B -m hope_cad.data.download"
download-vit = "python -B -m hope_cad.data.provision --only vit"
env-check = "python -B scripts/check_environment.py"

[dependencies]
nomkl = "*"
setuptools = "<82"
python = "3.14.*"
numpy = "*"
scikit-learn = "*"
pyyaml = ">=6.0"
tqdm = ">=4.65.0"

# Per-package indexes avoid resolving unrelated dependencies through CUDA indexes.
[pypi-options]
index-strategy = "first-index"

[pypi-dependencies]
pillow = "==12.2.0"
timm = ">=1.0.20,<2"
safetensors = ">=0.4.5"
hope-cad = { path = ".", editable = true }

[target.win-64.pypi-dependencies]
torch = { version = "==2.12.0+cu126", index = "https://download.pytorch.org/whl/cu126" }
torchvision = { version = "==0.27.0+cu126", index = "https://download.pytorch.org/whl/cu126" }

# The same default environment resolves to the established local Windows stack
# and the pinned remote Linux stack. No second package manager or venv bootstrap.
[target.linux-64.dependencies]
python = "3.13.*"
numpy = "==2.1.3"
scikit-learn = "==1.6.1"
pyyaml = "==6.0.3"
tqdm = "==4.67.1"

[target.linux-64.pypi-dependencies]
torch = { version = "==2.11.0+cu128", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = "==0.26.0+cu128", index = "https://download.pytorch.org/whl/cu128" }
pillow = "==12.3.0"
timm = "==1.0.29"
safetensors = "==0.8.0"
pytest = "==8.4.2"

[feature.test.pypi-dependencies]
pytest = ">=8,<10"

[environments]
default = { features = ["test"], solve-group = "default" }
