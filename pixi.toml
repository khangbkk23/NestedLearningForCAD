[workspace]
channels = ["conda-forge"]
name = "NestedLearningForCAD"
platforms = ["win-64", "linux-64"]
version = "0.1.0"

[pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu126"]
index-strategy = "unsafe-best-match"   # uv prioritizes the CUDA index

[feature.runtime.dependencies]
python = "==3.14.4"
numpy = "==2.4.5"
[feature.runtime.pypi-dependencies]
torch = {version = "==2.12.0+cu126", index = "https://download.pytorch.org/whl/cu126"}
torchvision = {version = "==0.27.0+cu126", index = "https://download.pytorch.org/whl/cu126"}
timm = "==1.0.29"
safetensors = "==0.7.0"
pillow = "==12.2.0"
[feature.test.dependencies]
pytest = ">=7,<10"
[feature.test.tasks]
test = "python -B -m pytest tests -q -p no:cacheprovider --basetemp=.local/cache/tests/pytest"

[feature.source-layout.target.win-64.activation]
scripts = ["scripts/activate_source.bat"]
[feature.source-layout.target.linux-64.activation]
scripts = ["scripts/activate_source.sh"]

[feature.source-layout.tasks]
train = "python -B scripts/train.py"
check = "python -B scripts/train.py --check"
assets = "python -B scripts/prepare_assets.py"
package = "python -B scripts/kaggle_run.py pack"

[environments]
default = {features=["runtime","source-layout"], no-default-feature=true, solve-group="cad"}
cad = {features=["runtime","source-layout"], no-default-feature=true, solve-group="cad"}
cad-test = {features=["runtime","test","source-layout"], no-default-feature=true, solve-group="cad"}
