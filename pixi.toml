[workspace]
channels = ["conda-forge"]
name = "NestedLearningForCAD"
platforms = ["win-64", "linux-64"]
version = "0.1.0"

[tasks]
install = "python scripts/install_local.py"
test = "python -B -m hope_cad.local_tests"
preflight-local = "python -B -m hope_cad preflight --local-smoke --device cpu --run-dir results/local-preflight"

[dependencies]
nomkl = "*"
setuptools = "<82"
python = "3.14.*"
numpy = "*"
scikit-learn = "*"
pyyaml = ">=6.0"
tqdm = ">=4.65.0"

# Initialize CUDA 12.6 for PyTorch
[pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu126"]
index-strategy = "unsafe-best-match"   # uv prioritizes the CUDA index

[pypi-dependencies]
pillow = "==12.2.0"
torch = "*"
torchvision = "*"
timm = ">=1.0.20,<2"
safetensors = ">=0.4.5"

[feature.test.pypi-dependencies]
pytest = ">=8,<10"

[environments]
default = { features = ["test"], solve-group = "default" }
